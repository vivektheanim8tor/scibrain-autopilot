name: Sci.Brain Daily Autonomous Publisher

on:
  schedule:
    # Runs reliably every 15 minutes 24/7 (cloud_publisher.py checks target time)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish immediately (bypass schedule timer)'
        required: false
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sci.Brain Publisher
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_CONFIG_JSON: ${{ secrets.META_CONFIG_JSON }}
          FORCE_PUBLISH: ${{ inputs.force || (github.event_name == 'workflow_dispatch' && 'true') || 'false' }}
        run: |
          python cloud_publisher.py
