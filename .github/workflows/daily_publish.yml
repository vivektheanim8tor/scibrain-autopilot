name: Sci.Brain Daily Autonomous Publisher

on:
  schedule:
    # Runs every 15 minutes across peak curiosity windows:
    # 07:00-10:00 UTC = 12:30 PM - 03:30 PM IST (Afternoon window)
    # 13:00-17:00 UTC = 06:30 PM - 10:30 PM IST (Evening curiosity peak)
    - cron: '*/15 7-10,13-17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI / API

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sci.Brain Publisher
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          META_CONFIG_JSON: ${{ secrets.META_CONFIG_JSON }}
        run: |
          python cloud_publisher.py
