name: Sci.Brain Daily Autonomous Publisher

on:
  schedule:
    # Runs every 20 minutes across peak curiosity windows (Afternoon & Evening IST)
    # 07:00-09:30 UTC = 12:30 PM - 03:00 PM IST
    # 13:00-16:30 UTC = 06:30 PM - 10:00 PM IST
    - cron: '*/20 7-9,13-16 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI / API

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Sci.Brain Publisher
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          META_CONFIG_JSON: ${{ secrets.META_CONFIG_JSON }}
        run: |
          python cloud_publisher.py
